services:
  db:
    image: postgis/postgis:16-3.4
    container_name: maschinenringe_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maschinenringe
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maschinenringe"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: maschinenringe_backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: maschinenringe
      JWT_SECRET: devsecret
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

  frontend:
    build: ./frontend
    container_name: maschinenringe_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    profiles: ["full"]

volumes:
  pgdata:
